<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="NextSDE practice and learning tools are coming soon.">
  <title>Coming soon · NextSDE</title>
  <link rel="icon" type="image/png" href="media/nextsde-icon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Geist,system-ui,sans-serif;color:#202630;background:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background-image:radial-gradient(circle,rgba(36,88,170,.13) 1px,transparent 1.5px);background-size:32px 32px}
    main{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{width:min(100%,640px);padding:clamp(32px,6vw,64px);border:1px solid #dfe6ef;border-radius:20px;background:#fff;box-shadow:0 24px 70px -45px rgba(24,52,96,.35);text-align:center}
    img{width:155px;height:auto;margin:0 auto 40px}.kicker{display:inline-block;padding:6px 12px;border-radius:999px;background:#e7f0ff;color:#0754c2;font-size:12px;font-weight:600}
    h1{margin:18px 0 16px;font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.05em;font-weight:600;text-wrap:balance}
    p{margin:0 auto;max-width:440px;color:#606b7c;font-size:18px;line-height:28px;text-wrap:pretty}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:32px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid #dfe6ef;color:#202630;text-decoration:none;font-weight:600;transition:transform .2s,background .2s}
    a:hover{transform:translateY(-2px);background:#f4f6f9}a:active{transform:scale(.98)}a:focus-visible{outline:2px solid #0b62ed;outline-offset:4px}
    .primary{background:#0b62ed;border-color:#0b62ed;color:#fff}.primary:hover{background:#0754d3}
  </style>
</head>
<body><main><div class="card"><img src="media/nextsde-logo-light.webp" alt="NextSDE"><span class="kicker">In progress</span><h1>Coming soon.</h1><p>We’re getting this part of NextSDE ready. Check back shortly, or contact us if you have a question.</p><div class="actions"><a class="primary" href="/v2/">Back to home</a><a href="mailto:contactus@nextsde.com">Contact us</a></div></div></main></body>
</html>
